<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-card">
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.4V19l-3-1.7v-4.9L4 5Z"></path></svg>
        </div>
        <div class="brand-details">
          <span class="app-name">TuneX</span>
          <div class="status-row" aria-live="polite"><span class="status-dot" id="statusDot"></span><span id="statusText">Filtering is on</span></div>
        </div>
      </div>
      <label class="toggle master-toggle" title="Turn TuneX on or off">
        <span class="sr-only">Enable TuneX</span><input type="checkbox" id="masterSwitch" checked>
        <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
      </label>
    </header>

    <main class="app-content" id="mainContent">
      <section class="panel-section" aria-labelledby="presetHeading">
        <div class="section-heading"><h2 id="presetHeading">Choose a view</h2><span>Quick setup</span></div>
        <div class="preset-grid" id="presetGroup">
          <button type="button" class="preset" data-preset="text_only" title="Keep only text posts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12M6 11h12M6 16h8"></path></svg><span>Text only</span>
          </button>
          <button type="button" class="preset" data-preset="text_and_images" title="Keep text and image posts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="m6 17 4-4 3 3 2-2 3 3"></path></svg><span>Text + images</span>
          </button>
          <button type="button" class="preset" data-preset="no_videos" title="Hide videos but keep everything else">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="13" height="12" rx="2"></rect><path d="m17 10 3-2v8l-3-2M5 4l14 16"></path></svg><span>No videos</span>
          </button>
          <button type="button" class="preset active" data-preset="custom" title="Use the filters below">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg><span>Custom</span>
          </button>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="filterHeading">
        <div class="section-heading"><h2 id="filterHeading">Hide posts containing</h2><span>Tap a row to change</span></div>
        <div class="filter-list">
          <label class="filter-row" for="filterVideos"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"></rect><path d="m17 10 4-2v8l-4-2"></path></svg></span><span class="filter-copy"><strong>Videos</strong><small>Clips and live broadcasts</small></span><span class="toggle"><input type="checkbox" id="filterVideos"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span></span></label>
          <label class="filter-row" for="filterGifs"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8V6h14v12H5v-2M8 12h8M13 9l3 3-3 3"></path></svg></span><span class="filter-copy"><strong>Animated GIFs</strong><small>Looping reaction media</small></span><span class="toggle"><input type="checkbox" id="filterGifs"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span></span></label>
          <label class="filter-row" for="filterImages"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="m6 17 4-4 3 3 2-2 3 3"></path></svg></span><span class="filter-copy"><strong>Images</strong><small>Photos and galleries</small></span><span class="toggle"><input type="checkbox" id="filterImages"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span></span></label>
          <label class="filter-row" for="filterCards"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 15 15 9M7.5 12.5l-1 1a3 3 0 0 0 4 4l2-2M16.5 11.5l1-1a3 3 0 0 0-4-4l-2 2"></path></svg></span><span class="filter-copy"><strong>Link previews</strong><small>Large external link cards</small></span><span class="toggle"><input type="checkbox" id="filterCards"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span></span></label>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="behaviorHeading">
        <div class="section-heading"><h2 id="behaviorHeading">When a post matches</h2></div>
        <div class="segmented-control">
          <label class="segment"><input type="radio" name="hideMode" value="hide" id="modeHide" checked><span><strong>Remove it</strong><small>No empty space</small></span></label>
          <label class="segment"><input type="radio" name="hideMode" value="placeholder" id="modePlaceholder"><span><strong>Let me reveal it</strong><small>Show a quiet placeholder</small></span></label>
        </div>
      </section>

      <section class="session-card" aria-labelledby="sessionHeading">
        <div class="session-summary"><span class="session-count" id="statTotal">0</span><span><strong id="sessionHeading">posts hidden</strong><small>on this tab</small></span></div>
        <div class="session-breakdown" aria-label="Hidden post breakdown"><span><b id="statVideos">0</b> video</span><span><b id="statGifs">0</b> GIF</span><span><b id="statImages">0</b> image</span></div>
        <button id="refreshBtn" class="refresh-button" title="Scan the current timeline again" aria-label="Scan timeline again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg></button>
      </section>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
